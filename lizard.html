<style>
    .container {

    section.header {

    .main-header {

    .highlight {
        background: linear-gradient(90deg, #A1F609, #00DEEB);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .text-icon {
        display: flex;

        gap: 20px;

    .text-icon .icon-text2 {
